[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# /api/submit-lead is handled by Next.js (Google Sheets + optional n8n webhook)

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
