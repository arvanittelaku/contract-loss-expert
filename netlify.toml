[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# /api/submit-lead is handled by Next.js (Google Sheets + optional n8n webhook)

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600, s-maxage=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=3600, s-maxage=86400"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=604800"

[[headers]]
  for = "/icon"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=604800"
